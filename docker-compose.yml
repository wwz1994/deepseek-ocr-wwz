# Docker Compose 配置
#
# 为什么使用 Docker Compose？
# 1. 一键部署多个容器
# 2. 管理容器间的网络和依赖
# 3. 统一配置管理
# 4. 简化开发和生产环境部署

version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deepseek-ocr-backend

    # 端口映射（可选，主要通过 Nginx 访问）
    # ports:
    #   - "8000:8000"

    # 环境变量
    environment:
      - MODEL_PATH=deepseek-ai/DeepSeek-OCR
      - CUDA_VISIBLE_DEVICES=0

    # GPU 支持（需要 NVIDIA Container Toolkit）
    # 为什么需要 GPU？
    # - DeepSeek-OCR 是深度学习模型
    # - GPU 加速推理速度 10-100 倍
    # - 建议使用 A100/V100 等高性能 GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # 数据卷（持久化上传的文件）
    volumes:
      - ./backend/static/uploads:/app/static/uploads
      # 挂载 DeepSeek-OCR 模型代码
      - ./DeepSeek-OCR-master:/home/user/DeepSeek-OCR/DeepSeek-OCR-master

    # 网络
    networks:
      - ocr-network

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # 重启策略
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deepseek-ocr-frontend

    # 端口映射
    ports:
      - "80:80"

    # 依赖后端服务
    depends_on:
      - backend

    # 网络
    networks:
      - ocr-network

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

    # 重启策略
    restart: unless-stopped

# 网络配置
networks:
  ocr-network:
    driver: bridge

# 数据卷配置
volumes:
  uploads:
    driver: local
